# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'dracula/tmux'
# Customize Plugins
# Dracula: powerline com nome da sessão, CPU, RAM, bateria e hora
set -g @dracula-plugins "cpu-usage ram-usage battery time"
set -g @dracula-show-powerline true
set -g @dracula-show-left-icon session
set -g @dracula-military-time true
set -g @dracula-day-month true

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)

# True color: cores reais do Dracula em vez das 256 aproximadas
set -g default-terminal "tmux-256color"
set -as terminal-features ",*:RGB"

# Adiciona scroll no terminal
set-option -g mouse on

# Janelas e panes numerados a partir de 1; renumera ao fechar
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# prefix + r recarrega a config
bind r source-file ~/.tmux.conf \; display "Config recarregada!"

# Novas janelas abrem no diretório atual
bind c new-window -c "#{pane_current_path}"

# prefix + g abre um terminal flutuante (popup) por cima dos panes
bind g display-popup -E -w 80% -h 75% -d "#{pane_current_path}"

# Aumenta o histórico de scrollback (padrão é 2000 linhas)
set -g history-limit 100000

# Copy-mode estilo vim: v inicia seleção, y copia, Ctrl-v seleção retangular
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'

# Muda o Split para | vertical e - horizontal (no diretório atual)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Copia sempre para o clipboard do macOS, sem depender do iTerm2/OSC 52
set -s copy-command 'pbcopy'
set -g set-clipboard on

# Ao soltar o mouse: copia mas mantém a seleção visível e a posição do scroll
bind -T copy-mode      MouseDragEnd1Pane send -X copy-pipe-no-clear
bind -T copy-mode-vi   MouseDragEnd1Pane send -X copy-pipe-no-clear

# prefix + Y copia TODO o histórico do pane atual para o clipboard
bind Y run-shell 'tmux capture-pane -p -S - -t "#{pane_id}" | pbcopy' \; display 'Histórico copiado!'

# prefix + E abre TODO o histórico do pane no editor/less (bom para outputs gigantes)
bind E run-shell 'tmux capture-pane -p -S - -t "#{pane_id}" > /tmp/tmux-scrollback.txt' \; new-window 'less /tmp/tmux-scrollback.txt'

run '~/.tmux/plugins/tpm/tpm'
